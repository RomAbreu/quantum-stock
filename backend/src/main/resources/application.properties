spring.application.name=backend
server.port=${SERVER_PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/quantum-stock
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/quantum-stock/protocol/openid-connect/certs

jwt.auth.converter.resource-id=quantum-stock-backend
jwt.auth.converter.principle-attribute=preferred_username

keycloak.server.url=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}
keycloak.realm.name=quantum-stock
keycloak.realm.master=master
keycloak.admin.cli=admin-cli
keycloak.user.console=admin
keycloak.console.password=admin

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.user=${DATABASE_USER}
spring.flyway.password=${DATABASE_PASSWORD}

management.endpoints.web.exposure.include=prometheus
management.endpoint.health.show-details=always