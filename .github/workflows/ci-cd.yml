name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Regression Test Backend
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: test_rootroot
      MYSQL_DATABASE: test_inventory_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_12345678
      MYSQL_TCP_PORT: 3307

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start containers
        run: docker compose -f "./backend/docker-compose.yaml" --profile test up -d

      - name: Setup MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE ${{ env.MYSQL_DATABASE }};' -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }} -P${{ env.MYSQL_TCP_PORT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build application
        working-directory: ./backend
        run: ./gradlew clean build -x test

      - name: Run Unit Tests
        working-directory: ./backend
        run: ./gradlew cucumberTest

      - name: Run Cucumber Tests
        working-directory: ./backend
        run: ./gradlew unitTest

      - name: Upload JUnit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUnit Test Reports
          path: |
            build/reports/tests/unitTest/index.html
          retention-days: 30

      - name: Upload Cucumber test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cucumber Test Reports
          path: |
            build/reports/tests/cucumberTest/index.html
            target/cucumber-reports.html
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker-compose -f "./backend/docker-compose.yaml" down
